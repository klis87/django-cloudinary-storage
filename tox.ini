[tox]
requires =
    tox>=4.22
    tox-uv>=1.11
env_list =
    py{310,312}-dj42
    py{310,314}-dj52
    py{312,314}-dj{60,61}

[testenv]
dependency_groups = dev
deps =
    dj42: Django>=4.2,<4.3
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
set_env =
    file|{tox_root}/.env
commands =
    python -W error::DeprecationWarning -m coverage run --source=cloudinary_storage manage.py test {posargs}
    python -m coverage report
